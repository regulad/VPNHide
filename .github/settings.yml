    - dopamine
    - vpn
    - vpn-detection
    - anti-detection
    - theos
    - ellekit
    - libsandy
    - altlist
    - arm64e
    - ios15
  has_issues: true
  has_projects: false
  has_wiki: false
  has_downloads: true
  default_branch: master
  allow_squash_merge: true
  allow_merge_commit: true
