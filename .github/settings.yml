# Repository configuration, managed by the Settings app
# (https://github.com/repository-settings/app). The shared defaults come from
# regulad/.github; this file sets only what is this repository's own.
_extends: .github

repository:
  name: VPNHide
  description: >-
    Hides an on-device VPN interface from chosen iOS apps, while their
    traffic keeps routing through the VPN
  homepage: ""
  private: false
  # Topics: comma-and-space separated string, NOT a YAML list.
  topics: "ios, jailbreak, tweak, roothide, dopamine, vpn, vpn-detection, anti-detection, theos, ellekit, libsandy, altlist, arm64e, ios15"
  default_branch: master

  allow_merge_commit: true
